
name: Construire mon APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools,platforms;android-35,build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Preparer le projet Android
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/suiviprod/primes

          cp index.html app/src/main/assets/
          cp manifest.json app/src/main/assets/
          cp sw.js app/src/main/assets/
          cp -r icons app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SuiviProdPrimes'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.suiviprod.primes'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.suiviprod.primes'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Suivi Prod &amp; Primes"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/suiviprod/primes/MainActivity.java <<'EOF'
          package com.suiviprod.primes;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Compiler l'APK
        run: gradle assembleDebug

      - name: Recuperer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Suivi-Prod-Primes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
